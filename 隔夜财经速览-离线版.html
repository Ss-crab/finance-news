  <style>
:root {
  --bg: #f2f5f9;
  --surface: rgba(255, 255, 255, 0.92);
  --solid: #ffffff;
  --surface-2: #f6f8fb;
  --text: #1e293b;
  --text-2: #64748b;
  --text-3: #94a3b8;
  --border: rgba(148, 163, 184, 0.25);
  --primary: #1e3a5f;
  --primary-light: #2c5282;
  --accent: #c9a227;
  --up: #d92b2b;
  --down: #16976b;
  --neutral: #64748b;
  --shadow: 0 1px 3px rgba(15,23,42,.05), 0 6px 18px rgba(15,23,42,.05);
  --radius: 14px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; color: var(--text); }
body { min-height: 100vh; background: var(--bg); padding-bottom: calc(60px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; position: relative; }

/* ---------- 晨昏线背景 ---------- */
.sky-bg { position: fixed; inset: 0 0 auto 0; height: 340px; z-index: -1; overflow: hidden; transition: background 1.5s ease; pointer-events: none; }
.sky-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, var(--bg) 100%); }
.sky-horizon { position: absolute; left: -20%; right: -20%; height: 220px; border-radius: 50%; bottom: 40px; opacity: .5; transition: background 1.5s ease; }
.sky-sun { position: absolute; width: 90px; height: 90px; border-radius: 50%; left: 50%; top: 120px; transform: translateX(-50%); filter: blur(2px); transition: all 1.5s ease; }
.sky-stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s ease; background-image: radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.9), transparent), radial-gradient(1.5px 1.5px at 80px 60px, rgba(255,255,255,.8), transparent), radial-gradient(2px 2px at 140px 20px, rgba(255,255,255,.7), transparent), radial-gradient(1px 1px at 200px 70px, rgba(255,255,255,.9), transparent), radial-gradient(1.5px 1.5px at 260px 40px, rgba(255,255,255,.7), transparent); background-size: 300px 120px; }

/* ---------- Header ---------- */
.app-header { position: sticky; top: 0; z-index: 20; padding: calc(14px + env(safe-area-inset-top)) 18px 12px; color: #fff; background: rgba(20, 38, 66, .55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.header-main { display: flex; align-items: center; justify-content: space-between; }
.app-title { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .5px; }
.app-subtitle { margin: 2px 0 0; font-size: 11.5px; color: rgba(255,255,255,.75); }
.icon-btn { background: rgba(255,255,255,.15); border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s; }
.icon-btn:active { background: rgba(255,255,255,.3); }
.icon-btn.spinning svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.status-banner { margin-top: 8px; padding: 6px 12px; border-radius: 8px; font-size: 11.5px; background: rgba(255,255,255,.12); color: #ffe9b0; }
.status-banner.error { background: rgba(217,43,43,.3); color: #ffdada; }
.hidden { display: none !important; }

/* ---------- Mood hero (猫猫) ---------- */
.mood-hero { margin: 16px 14px 4px; display: flex; align-items: center; gap: 14px; background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
.cat-box { flex: 0 0 92px; height: 92px; border-radius: 16px; background: linear-gradient(145deg,#fff6da,#ffe6a8); display: flex; align-items: center; justify-content: center; }
.mood-info { flex: 1; min-width: 0; }
.mood-label { font-size: 11px; color: var(--text-3); }
.mood-cat-mood { font-size: 15px; font-weight: 700; margin: 1px 0 8px; }
.mood-scale-wrap { width: 100%; }
.mood-scale { position: relative; height: 7px; border-radius: 6px; background: linear-gradient(90deg,#16976b,#d9c34a,#d92b2b); }
.mood-scale-fill { position: absolute; top: -3px; width: 4px; height: 13px; background: #1e293b; border-radius: 3px; left: 50%; transition: left .6s ease; box-shadow: 0 0 0 2px #fff; }
.mood-scale-mid { position: absolute; left: 50%; top: 0; width: 1px; height: 7px; background: rgba(255,255,255,.6); }
.mood-scale-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-3); margin-top: 3px; }
.mood-score { font-size: 26px; font-weight: 800; min-width: 54px; text-align: right; }
.mood-score.pos { color: var(--up); }
.mood-score.neg { color: var(--down); }
.mood-score.zero { color: var(--neutral); }

/* ---------- Section ---------- */
.section { margin: 16px 14px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; padding: 0 2px; }
.section-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--primary); }
.sec-icon { color: var(--accent); margin-right: 3px; }
.hint-text, .count-badge { font-size: 11px; color: var(--text-3); }

/* ---------- Quotes ---------- */
.quotes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quote-card { background: var(--surface); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 12px; padding: 10px 10px 9px; box-shadow: var(--shadow); cursor: pointer; transition: transform .12s; position: relative; overflow: hidden; }
.quote-card:active { transform: scale(.96); }
.quote-card .qc-name { font-size: 10.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quote-card .qc-price { font-size: 15px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.quote-card .qc-chg { font-size: 10.5px; font-variant-numeric: tabular-nums; margin-top: 1px; }
.qc-up { color: var(--up); }
.qc-down { color: var(--down); }
.qc-flat { color: var(--neutral); }
.quote-card .qc-spark { position: absolute; right: 4px; bottom: 4px; width: 46px; height: 20px; opacity: .85; }
.quote-card .qc-ref { position: absolute; top: 4px; right: 5px; font-size: 8px; color: var(--accent); }

/* ---------- Top picks ---------- */
.top-picks { display: flex; flex-direction: column; gap: 9px; }
.top-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--up); border-radius: var(--radius); padding: 12px 13px 12px 14px; box-shadow: var(--shadow); text-decoration: none; color: inherit; display: block; transition: transform .12s; }
.top-card:active { transform: scale(.995); }
.top-card .rank { position: absolute; top: 9px; right: 11px; font-size: 20px; font-weight: 800; color: #eef2f7; line-height: 1; }
.top-card .tc-title { font-size: 13.5px; font-weight: 700; margin: 0 24px 5px 0; line-height: 1.42; }
.top-card .tc-meta { font-size: 10.5px; color: var(--text-3); display: flex; gap: 7px; flex-wrap: wrap; }
.top-card .tc-view { font-size: 11.5px; color: var(--text-2); margin: 6px 0 0; }
.top-card.negative { border-left-color: var(--down); }
.top-card.neutral { border-left-color: var(--neutral); }
.topic-chip { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 5px; background: #eef4fb; color: var(--primary-light); }

/* ---------- Filter ---------- */
.filter-bar { margin: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px 14px; box-shadow: var(--shadow); }
.filter-row { display: flex; align-items: center; gap: 10px; }
.filter-row + .filter-row { margin-top: 10px; }
.filter-label { font-size: 11.5px; color: var(--text-2); flex: 0 0 42px; }
.filter-row input[type=range] { flex: 1; accent-color: var(--primary); }
.filter-value { font-size: 11px; color: var(--primary); min-width: 34px; text-align: right; }
.chip-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.chip-scroll::-webkit-scrollbar { display: none; }
.subchip { flex: 0 0 auto; font-size: 10.5px; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border); background: var(--solid); color: var(--text-2); cursor: pointer; white-space: nowrap; }
.subchip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 14px 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); padding: 6px 13px; border-radius: 18px; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: all .15s; }
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

/* ---------- Feed ---------- */
.feed { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; flex-wrap: wrap; }
.market-chip { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #eef2f7; color: var(--primary-light); }
.topic-chip-2 { font-size: 10.5px; padding: 2px 8px; border-radius: 6px; background: #fdf6e3; color: #8a6d1f; }
.importance { display: flex; gap: 2px; }
.importance i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.importance i.on { background: var(--accent); }
.card-time { margin-left: auto; font-size: 10.5px; color: var(--text-3); }
.card-title { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; line-height: 1.42; }
.card-title a { color: var(--text); text-decoration: none; }
.card-summary { margin: 0; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
.card-view { margin: 9px 0 0; font-size: 11.5px; color: var(--text); background: var(--surface-2); border-left: 3px solid var(--primary-light); border-radius: 0 8px 8px 0; padding: 7px 9px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
.tag { font-size: 10.5px; color: var(--primary-light); background: #eef4fb; border: 1px solid #dbe7f4; padding: 1px 7px; border-radius: 6px; text-decoration: none; }
.sentiment-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.sentiment-dot.positive { background: var(--up); }
.sentiment-dot.negative { background: var(--down); }
.sentiment-dot.neutral { background: var(--neutral); }
.empty-state { text-align: center; padding: 34px 20px; color: var(--text-3); font-size: 12.5px; }
.skeleton-card { height: 88px; border-radius: var(--radius); background: linear-gradient(90deg,#eef1f5 25%,#f7f9fb 50%,#eef1f5 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; }
.modal-sheet { width: 100%; max-width: 720px; background: var(--solid); border-radius: 20px 20px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom)); animation: slideUp .28s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-price { font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.modal-close { background: var(--surface-2); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 22px; line-height: 1; color: var(--text-2); cursor: pointer; }
.chart-tabs { display: flex; gap: 6px; margin: 14px 0 8px; }
.chart-tab { border: 1px solid var(--border); background: var(--solid); color: var(--text-2); padding: 4px 14px; border-radius: 14px; font-size: 12px; cursor: pointer; }
.chart-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.chart-wrap { height: 220px; position: relative; }
#chart-canvas { width: 100%; height: 100%; }
.chart-note { font-size: 11px; color: var(--text-3); margin-top: 6px; min-height: 16px; }

/* ---------- Disclaimer ---------- */
.disclaimer { margin: 22px 14px 10px; padding: 15px; background: rgba(238,241,245,.85); border-radius: 12px; font-size: 11px; color: var(--text-2); line-height: 1.6; }
.disclaimer strong { color: var(--text); font-size: 12px; }
.disclaimer p { margin: 5px 0 0; }
.foot-note { color: var(--text-3) !important; font-size: 10px !important; }

/* ---------- Pull ---------- */
.pull-indicator { position: fixed; top: -50px; left: 0; right: 0; text-align: center; font-size: 12px; color: #fff; background: var(--primary); padding: 10px; transition: top .2s; z-index: 60; }
.pull-indicator.show { top: 0; }

@media (max-width: 380px) {
  .app-title { font-size: 17px; }
  .mood-score { font-size: 22px; }
  .quote-card .qc-price { font-size: 13.5px; }
}

</style>
</head>
<body>
  <!-- 晨昏线动态背景 -->
  <div class="sky-bg" id="sky-bg" aria-hidden="true">
    <div class="sky-horizon"></div>
    <div class="sky-sun" id="sky-sun"></div>
    <div class="sky-stars" id="sky-stars"></div>
  </div>

  <header class="app-header">
    <div class="header-main">
      <div>
        <h1 class="app-title">隔夜财经速览</h1>
        <p class="app-subtitle" id="update-time">正在加载...</p>
      </div>
      <button id="refresh-btn" class="icon-btn" aria-label="刷新数据" title="刷新数据">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>
    <div id="status-banner" class="status-banner hidden"></div>
  </header>

  <main>
    <!-- 猫猫心情 + 多空程度 -->
    <section class="mood-hero" id="mood-hero">
      <div class="cat-box" id="cat-box">
        <svg id="cat-svg" viewBox="0 0 120 120" width="92" height="92" aria-label="市场心情猫猫"></svg>
      </div>
      <div class="mood-info">
        <div class="mood-label" id="mood-label">市场情绪</div>
        <div class="mood-cat-mood" id="mood-cat-mood">加载中…</div>
        <div class="mood-scale-wrap">
          <div class="mood-scale">
            <div class="mood-scale-fill" id="mood-fill"></div>
            <div class="mood-scale-mid"></div>
          </div>
          <div class="mood-scale-labels"><span>极空</span><span>中性</span><span>极多</span></div>
        </div>
      </div>
      <div class="mood-score" id="mood-score">--</div>
    </section>

    <!-- 行情速览 -->
    <section class="section" id="quotes-section">
      <div class="section-head">
        <h2 class="section-title"><span class="sec-icon">◇</span> 行情速览</h2>
        <span class="hint-text">点击查看走势</span>
      </div>
      <div class="quotes-grid" id="quotes-grid"></div>
    </section>

    <!-- 隔夜要点速览 -->
    <section class="section" id="top-section">
      <div class="section-head">
        <h2 class="section-title"><span class="sec-icon">✦</span> 隔夜要点</h2>
        <span class="hint-text" id="top-count"></span>
      </div>
      <div id="top-picks" class="top-picks"></div>
    </section>

    <!-- 筛选控制 -->
    <section class="filter-bar" id="filter-bar">
      <div class="filter-row">
        <span class="filter-label">重要性</span>
        <input type="range" id="importance-range" min="1" max="5" value="1" step="1">
        <span class="filter-value" id="importance-value">全部</span>
      </div>
      <div class="filter-row">
        <span class="filter-label">主题</span>
        <div class="chip-scroll" id="subtopic-chips"></div>
      </div>
    </section>

    <!-- 分区导航 -->
    <nav class="tabs" id="market-tabs" aria-label="市场分区">
      <button class="tab active" data-market="all">全部</button>
      <button class="tab" data-market="A股">A股</button>
      <button class="tab" data-market="美股宏观">美股</button>
      <button class="tab" data-market="港股">港股</button>
      <button class="tab" data-market="加密商品外汇">商品外汇</button>
      <button class="tab" data-market="债券">债券</button>
    </nav>

    <!-- 新闻列表 -->
    <section class="section" id="feed-section">
      <div class="section-head">
        <h2 class="section-title" id="feed-title">全部要闻 · 时间线</h2>
        <span class="count-badge" id="feed-count"></span>
      </div>
      <div id="feed" class="feed"></div>
    </section>

    <!-- 免责声明 -->

    var face = '#FFD95E', line = '#8a6d1f', blush = 'rgba(230,120,120,.4)';
    if (cat === 'bull') {           // 起飞：星星眼 + 大笑
      eyes = '<path d="M38 52 l4 -7 4 7 -4 7z" fill="#fff" stroke="' + line + '"/><path d="M74 52 l4 -7 4 7 -4 7z" fill="#fff" stroke="' + line + '"/>';
      mouth = '<path d="M50 70 q10 12 20 0" fill="none" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/>';
      extra = '<text x="98" y="30" font-size="16">✦</text><text x="18" y="40" font-size="12">✦</text>';
    } else if (cat === 'happy') {   // 开心：眯眼笑
      eyes = '<path d="M36 52 q6 -8 12 0" fill="none" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/><path d="M72 52 q6 -8 12 0" fill="none" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/>';
      mouth = '<path d="M52 68 q8 9 16 0" fill="none" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/>';
    } else if (cat === 'worried') { // 担忧：耷拉眼 + 波浪嘴
      eyes = '<path d="M36 52 q6 6 12 0" fill="none" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/><path d="M72 52 q6 6 12 0" fill="none" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/>';
      mouth = '<path d="M53 72 q7 -6 14 0" fill="none" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/>';
    } else if (cat === 'bear') {    // 抱头：X眼 + 大开口 + 汗
      eyes = '<path d="M36 48 l12 10 M48 48 l-12 10 M72 48 l12 10 M84 48 l-12 10" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/>';
      mouth = '<ellipse cx="60" cy="74" rx="8" ry="7" fill="#7a4a3a"/>';
      extra = '<path d="M92 44 q4 6 0 10 q-4 -4 0 -10z" fill="#9ec8f0"/>';
    } else {                        // calm 淡定
      eyes = '<circle cx="42" cy="52" r="3" fill="' + line + '"/><circle cx="78" cy="52" r="3" fill="' + line + '"/>';
      mouth = '<path d="M54 68 h12" stroke="' + line + '" stroke-width="2.5" stroke-linecap="round"/>';
    }
    $('cat-svg').innerHTML =
      '<path d="M28 44 L24 18 L46 32 Z" fill="' + face + '" stroke="' + line + '" stroke-width="2"/>' +
      '<path d="M92 44 L96 18 L74 32 Z" fill="' + face + '" stroke="' + line + '" stroke-width="2"/>' +
      '<circle cx="60" cy="60" r="38" fill="' + face + '" stroke="' + line + '" stroke-width="2"/>' +
      '<ellipse cx="36" cy="64" rx="7" ry="4" fill="' + blush + '"/><ellipse cx="84" cy="64" rx="7" ry="4" fill="' + blush + '"/>' +
      '<path d="M56 62 l4 4 4 -4 z" fill="#e08a7a"/>' +
      eyes + mouth +
      '<path d="M34 62 l-12 -4 M34 68 l-12 2 M86 62 l12 -4 M86 68 l12 2" stroke="' + line + '" stroke-width="1.5" stroke-linecap="round"/>' +
      extra;
  }

  function renderMood(mood) {
    if (!mood) return;
    $('mood-label').textContent = '市场多空程度';
    $('mood-cat-mood').textContent = mood.catMood + ' · ' + mood.label;
    var s = mood.score || 0;
    var pct = (s + 100) / 200 * 100;
    $('mood-fill').style.left = 'calc(' + pct + '% - 2px)';
    var scoreEl = $('mood-score');
    scoreEl.textContent = (s > 0 ? '+' : '') + s;
    scoreEl.className = 'mood-score ' + (s > 20 ? 'pos' : s < -20 ? 'neg' : 'zero');
    renderCat(mood.cat);
  }

  // ---------- 行情 ----------
  function sparkPath(history, w, h) {
    if (!history || history.length < 2) return '';
    var vals = history.map(function (p) { return p.close; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), span = (mx - mn) || 1;
    return vals.map(function (v, i) {
      var x = (i / (vals.length - 1)) * w;
      var y = h - ((v - mn) / span) * (h - 4) - 2;
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
  }

  function renderQuotes(quotes) {
    var box = $('quotes-grid');
    var list = (quotes && quotes.quotes) || [];
    if (!list.length) { box.innerHTML = '<div class="empty-state">行情数据暂不可用</div>'; return; }
    box.innerHTML = list.map(function (q) {
      var dc = q.decimals == null ? 2 : q.decimals;
      var price = (q.price != null) ? (q.unit || '') + Number(q.price).toFixed(dc) : '--';
      var chg = q.changePct;
      var cls = chg == null ? 'qc-flat' : (chg > 0 ? 'qc-up' : chg < 0 ? 'qc-down' : 'qc-flat');
      var chgText = chg == null ? (q.reference ? '参考值' : '—') :
        (chg > 0 ? '+' : '') + Number(chg).toFixed(2) + '% ' + (chg > 0 ? '▲' : chg < 0 ? '▼' : '—');
      var spark = q.history && q.history.length > 1
        ? '<svg class="qc-spark" viewBox="0 0 46 20"><path d="' + sparkPath(q.history, 46, 20) +
          '" fill="none" stroke="' + (chg != null && chg < 0 ? '#16976b' : '#d92b2b') + '" stroke-width="1.5"/></svg>' : '';
      var ref = q.reference ? '<span class="qc-ref">参考</span>' : '';
      return '<div class="quote-card" data-key="' + esc(q.key) + '">' + ref +
        '<div class="qc-name">' + esc(q.name) + '</div>' +
        '<div class="qc-price">' + esc(price) + '</div>' +
        '<div class="qc-chg ' + cls + '">' + esc(chgText) + '</div>' + spark + '</div>';
    }).join('');
    // 绑定点击
    Array.prototype.forEach.call(box.querySelectorAll('.quote-card'), function (el) {
      el.addEventListener('click', function () { openChart(el.dataset.key); });
    });
  }

  // ---------- 走势图弹窗 ----------
  function openChart(key) {
    var q = (state.quotes && state.quotes.quotes || []).find(function (x) { return x.key === key; });
    if (!q) return;
    if (!q.history || q.history.length < 2) {
      $('chart-note').textContent = q.note || '该品种暂无历史走势数据' + (q.reference ? '（当前显示参考值）' : '');
    } else {
      $('chart-note').textContent = '数据来源：新浪财经 · 日线收盘价';
    }
    var dc = q.decimals == null ? 2 : q.decimals;
    var chg = q.changePct;
    $('chart-title').textContent = q.name;
    $('chart-price').innerHTML = (q.unit || '') + Number(q.price).toFixed(dc) +
      ' <span class="' + (chg > 0 ? 'qc-up' : chg < 0 ? 'qc-down' : 'qc-flat') + '">' +
      (chg == null ? '' : (chg > 0 ? '+' : '') + chg.toFixed(2) + '%') + '</span>';
    state.chart = q;
    $('chart-modal').classList.remove('hidden');
    drawChart();
  }
  function closeChart() { $('chart-modal').classList.add('hidden'); }

  function drawChart() {
    var q = state.chart; if (!q) return;
    var canvas = $('chart-canvas');
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    var W = rect.width, H = rect.height;
    ctx.clearRect(0, 0, W, H);
    var hist = (q.history || []).slice(-state.chartRange);
    if (hist.length < 2) {
      ctx.fillStyle = '#94a3b8'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('暂无历史走势数据', W / 2, H / 2);
      return;
    }
    var vals = hist.map(function (p) { return p.close; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var pad = (mx - mn) * 0.1 || 1; mn -= pad; mx += pad;
    var pl = 6, pr = 6, pt = 12, pb = 26;
    var cw = W - pl - pr, ch = H - pt - pb;
    var up = vals[vals.length - 1] >= vals[0];
    var color = up ? '#d92b2b' : '#16976b';
    // 网格
    ctx.strokeStyle = 'rgba(148,163,184,.2)'; ctx.lineWidth = 1;
    for (var g = 0; g <= 3; g++) { var gy = pt + ch * g / 3; ctx.beginPath(); ctx.moveTo(pl, gy); ctx.lineTo(W - pr, gy); ctx.stroke(); }
    // 面积
    var pts = vals.map(function (v, i) {
      return [pl + (i / (vals.length - 1)) * cw, pt + (1 - (v - mn) / (mx - mn)) * ch];
    });
    ctx.beginPath(); ctx.moveTo(pts[0][0], pt + ch);
    pts.forEach(function (p) { ctx.lineTo(p[0], p[1]); });
    ctx.lineTo(pts[pts.length - 1][0], pt + ch); ctx.closePath();
    var grad = ctx.createLinearGradient(0, pt, 0, pt + ch);
    grad.addColorStop(0, up ? 'rgba(217,43,43,.18)' : 'rgba(22,151,107,.18)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad; ctx.fill();
    // 线
    ctx.beginPath(); pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    // 末点
    var last = pts[pts.length - 1];
    ctx.beginPath(); ctx.arc(last[0], last[1], 3.5, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    // 轴标签
    ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
    ctx.textAlign = 'left'; ctx.fillText(hist[0].date.slice(5), pl, H - 8);
    ctx.textAlign = 'right'; ctx.fillText(hist[hist.length - 1].date.slice(5), W - pr, H - 8);
    ctx.textAlign = 'left'; ctx.fillText(mx.toFixed(q.decimals == null ? 0 : q.decimals), pl + 2, pt + 9);
  }

  // ---------- Top picks ----------
  function renderTop(data) {
    var box = $('top-picks');
    var ids = data.topPicks || [];
    var items = ids.map(function (id) {
      return (data.items || []).find(function (it) { return it.id === id; });
    }).filter(Boolean);
    if (!items.length) items = (data.items || []).slice(0, 8);
    $('top-count').textContent = items.length + ' 条 · 已智能去重';
    if (!items.length) { box.innerHTML = '<div class="empty-state">暂无要点数据</div>'; return; }
    box.innerHTML = items.map(function (it, i) {
      return '<a class="top-card ' + (it.sentiment || 'neutral') + '" href="' + esc(it.sourceUrl || '#') +
        '" target="_blank" rel="noopener"><span class="rank">' + (i + 1) + '</span>' +
        '<h3 class="tc-title">' + esc(it.title) + '</h3>' +
        '<div class="tc-meta"><span class="topic-chip">' + esc(it.subtopic || '综合') + '</span>' +
        '<span>' + esc(normMarket(it.market)) + '</span><span>' + esc(it.source || '') + '</span>' +
        '<span>' + esc(fmtTime(it.publishedAt)) + '</span></div>' +
        '<p class="tc-view">' + esc(it.tradingView || it.summary || '') + '</p></a>';
    }).join('');
  }

  // ---------- 筛选 chips ----------
  function renderSubtopicChips(data) {
    var counts = {};
    (data.items || []).forEach(function (it) { var t = it.subtopic || '综合'; counts[t] = (counts[t] || 0) + 1; });
    var topics = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 8);
    var box = $('subtopic-chips');
    var html = '<span class="subchip' + (state.subtopic === 'all' ? ' active' : '') + '" data-topic="all">全部</span>';
    html += topics.map(function (t) {
      return '<span class="subchip' + (state.subtopic === t ? ' active' : '') + '" data-topic="' + esc(t) + '">' + esc(t) + '</span>';
    }).join('');
    box.innerHTML = html;
  }

  // ---------- Feed ----------
  function importanceStars(n) {
    var h = '<span class="importance">';
    for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
    return h + '</span>';
  }
  function renderFeed(data) {
    var box = $('feed');
    var items = (data.items || []).filter(function (it) {
      if (state.market !== 'all' && normMarket(it.market) !== state.market) return false;
      if ((it.importance || 1) < state.minImportance) return false;
      if (state.subtopic !== 'all' && (it.subtopic || '综合') !== state.subtopic) return false;
      return true;
    });
    items.sort(function (a, b) { return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0); });
    $('feed-count').textContent = '共 ' + items.length + ' 条';
    $('feed-title').textContent = (state.market === 'all' ? '全部要闻' : state.market) + ' · 时间线';
    if (!items.length) { box.innerHTML = '<div class="empty-state">当前筛选下暂无新闻</div>'; return; }
    box.innerHTML = items.map(function (it) {
      var tags = (it.impactTags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      var url = it.sourceUrl || '#';
      return '<article class="card"><div class="card-head">' +
        '<span class="market-chip">' + esc(normMarket(it.market)) + '</span>' +
        '<span class="topic-chip-2">' + esc(it.subtopic || '综合') + '</span>' +
        importanceStars(it.importance || 1) +
        '<span class="card-time"><span class="sentiment-dot ' + (it.sentiment || 'neutral') + '"></span> ' + esc(fmtTime(it.publishedAt)) + '</span></div>' +
        '<h3 class="card-title"><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></h3>' +
        '<p class="card-summary">' + esc(it.summary || '') + '</p>' +
        '<p class="card-view">' + esc(it.tradingView || '') + '</p>' +
        '<div class="tags"><span class="tag" style="background:#f5f7fa;color:var(--text-2);border-color:var(--border)">' +
        esc({ positive: '偏积极', negative: '偏谨慎', neutral: '中性' }[it.sentiment] || '中性') + '</span>' + tags +
        (url && url !== '#' ? '<a class="tag" style="text-decoration:none" href="' + esc(url) + '" target="_blank" rel="noopener">原文 ↗</a>' : '') +
        '</div></article>';
    }).join('');
  }

  function renderAll(news, quotes) {
    if (news) {
      state.data = news;
      $('update-time').textContent = '更新于 ' + fullTime((news.meta || {}).generatedAt) + ' · 近 ' + ((news.meta || {}).windowHours || 24) + '小时';
      renderMood(news.mood);
      renderTop(news);
      renderSubtopicChips(news);
      renderFeed(news);
    }
    if (quotes) { state.quotes = quotes; renderQuotes(quotes); }
  }

  // ---------- 数据加载 ----------
  function fetchJSON(url, force) {
    return fetch(url + (force ? '?t=' + Date.now() : ''), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
    });
  }
  function showBanner(msg, isError) {
    var b = $('status-banner'); b.textContent = msg; b.className = 'status-banner' + (isError ? ' error' : '');
  }
  function loadData(force) {
    var btn = $('refresh-btn'); btn.classList.add('spinning');
    Promise.all([
      fetchJSON(NEWS_URL, force).catch(function () { return null; }),
      fetchJSON(QUOTES_URL, force).catch(function () { return null; })
    ]).then(function (res) {
      var news = res[0], quotes = res[1];
      var gotNews = news && Array.isArray(news.items);
      var gotQuotes = quotes && Array.isArray(quotes.quotes);
      if (gotNews) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(news)); } catch (e) {}
      }
      if (gotQuotes) {
        try { localStorage.setItem(QCache_KEY, JSON.stringify(quotes)); } catch (e) {}
      }
      var cNews = gotNews ? news : safeParse(CACHE_KEY);
      var cQuotes = gotQuotes ? quotes : safeParse(QCache_KEY);
      if (cNews || cQuotes) renderAll(cNews, cQuotes);
      if (!gotNews && !cNews) {
        if (!state.data) $('top-picks').innerHTML = '<div class="empty-state">数据加载失败，请点击右上角刷新</div>';
        showBanner('数据加载失败，请检查网络', true);
      } else if (!navigator.onLine) {
        showBanner('当前离线，展示缓存数据（可能非最新）', true);
      } else {
        showBanner('');
      }
    }).finally(function () { btn.classList.remove('spinning'); });
  }
  function safeParse(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }

  // ---------- 交互 ----------
  $('refresh-btn').addEventListener('click', function () { loadData(true); });
  $('chart-close').addEventListener('click', closeChart);
  $('chart-modal').addEventListener('click', function (e) { if (e.target === $('chart-modal')) closeChart(); });
  $('chart-tabs').addEventListener('click', function (e) {
    var t = e.target.closest('.chart-tab'); if (!t) return;
    document.querySelectorAll('.chart-tab').forEach(function (x) { x.classList.remove('active'); });
    t.classList.add('active'); state.chartRange = parseInt(t.dataset.range, 10); drawChart();
  });
  window.addEventListener('resize', function () { if (!$('chart-modal').classList.contains('hidden')) drawChart(); });

  $('market-tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab'); if (!tab) return;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active'); state.market = tab.dataset.market;
    if (state.data) renderFeed(state.data);
  });
  $('importance-range').addEventListener('input', function (e) {
    state.minImportance = parseInt(e.target.value, 10);
    $('importance-value').textContent = state.minImportance <= 1 ? '全部' : '≥' + state.minImportance + '星';
    if (state.data) renderFeed(state.data);
  });
  $('subtopic-chips').addEventListener('click', function (e) {
    var chip = e.target.closest('.subchip'); if (!chip) return;
    state.subtopic = chip.dataset.topic;
    Array.prototype.forEach.call($('subtopic-chips').children, function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    if (state.data) renderFeed(state.data);
  });

  // 下拉刷新
  var startY = 0, pulling = false, indicator = $('pull-indicator');
  window.addEventListener('touchstart', function (e) { if (window.scrollY <= 0) startY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    var dy = e.touches[0].clientY - startY;
    if (window.scrollY <= 0 && dy > 60) { pulling = true; indicator.classList.add('show'); indicator.textContent = dy > 110 ? '释放立即刷新' : '下拉刷新'; }
  }, { passive: true });
  window.addEventListener('touchend', function () { if (pulling) { indicator.classList.remove('show'); loadData(true); } pulling = false; });

  // 定时更新晨昏线（每 10 分钟）
  updateSky(); setInterval(updateSky, 600000);

  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  // 启动：先渲染缓存
  var cNews = safeParse(CACHE_KEY), cQuotes = safeParse(QCache_KEY);
  if (cNews || cQuotes) renderAll(cNews, cQuotes);
  loadData(false);
})();

</script>
</body>
</html>
