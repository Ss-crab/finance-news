name: 每日隔夜财经速览

# 每 12 小时更新一次（北京时间 7:30 / 19:30），同时支持手动触发
on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只运行一个数据生成任务，降低并发写入 main 的概率。
concurrency:
  group: finance-news-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 抓取近24小时新闻
        run: python scripts/fetch.py

      - name: 抓取行情（指数/贵金属/债券）
        run: python scripts/fetch_quotes.py

      - name: 加工生成 news.json（含多空程度）
        run: python scripts/process.py

      - name: 提交生成的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/raw_news.json docs/news.json docs/quotes.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新隔夜财经数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            # 运行期间若 main 前进，先把数据提交重放到最新 main 再推送。
            # 抓取文件是生成快照，冲突时保留本次刚生成的数据。
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "推送遇到并发更新，第 ${attempt} 次重试"
              sleep $((attempt * 2))
            done
            echo "多次尝试后仍无法推送生成的数据" >&2
            exit 1
          fi
