<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="隔夜财经速览 — 过去24小时全球重点金融新闻，辅助次日交易判断">
  <title>隔夜财经速览</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-main">
      <div>
        <h1 class="app-title">隔夜财经速览</h1>
        <p class="app-subtitle" id="update-time">正在加载...</p>
      </div>
      <button id="refresh-btn" class="icon-btn" aria-label="刷新数据" title="刷新数据">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>
    <div id="status-banner" class="status-banner hidden"></div>
  </header>

  <main>
    <!-- 隔夜要点速览 -->
    <section class="section" id="top-section">
      <div class="section-head">
        <h2 class="section-title"><span class="sec-icon">✦</span> 隔夜要点速览</h2>
      </div>
      <div id="top-picks" class="top-picks">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>

    <!-- 市场情绪概览 -->
    <section class="section" id="mood-section">
      <div class="section-head">
        <h2 class="section-title"><span class="sec-icon">◈</span> 市场情绪概览</h2>
      </div>
      <div id="mood-bar" class="mood-bar"></div>
    </section>

    <!-- 分区导航 -->
    <nav class="tabs" id="market-tabs" aria-label="市场分区">
      <button class="tab active" data-market="all">全部</button>
      <button class="tab" data-market="A股">A股</button>
      <button class="tab" data-market="美股宏观">美股宏观</button>
      <button class="tab" data-market="港股">港股</button>
      <button class="tab" data-market="加密商品外汇">加密·商品·外汇</button>
      <button class="tab" data-market="债券">债券</button>
    </nav>

    <!-- 新闻列表 -->
    <section class="section" id="feed-section">
      <div class="section-head">
        <h2 class="section-title" id="feed-title">全部要闻 · 时间线</h2>
        <span class="count-badge" id="feed-count"></span>
      </div>
      <div id="feed" class="feed"></div>
    </section>

    <!-- 免责声明 -->
    <footer class="disclaimer">
      <strong>免责声明</strong>
      <p>本应用仅汇总公开新闻并提供客观影响分析，不构成任何投资建议或要约。数据来自第三方，可能存在延迟或误差；市场有风险，决策请自主判断并核对原文。</p>
      <p class="foot-note">数据来源：东方财富、Google News、CNBC、MarketWatch、Yahoo Finance、美联储等公开渠道</p>
    </footer>
  </main>

  <!-- 下拉刷新指示 -->
  <div id="pull-indicator" class="pull-indicator">下拉刷新</div>

  <script src="app.js"></script>
</body>
</html>
